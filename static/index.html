<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>投放数据看板</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">
      <span class="logo-mark">投</span>
      <span class="logo-text">投放数据</span>
    </div>
    <nav class="nav">
      <div class="nav-group-title">短视频</div>
      <a class="nav-item" href="/dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16v-5"/><path d="M12 16V8"/><path d="M16 16v-3"/></svg>
        <span>投放号计划</span>
      </a>
    </nav>
    <div class="sidebar-footer">投放号计划</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="breadcrumb">投放号计划</div>
      <div class="topbar-right">
        <span class="user-chip">
          <span class="user-avatar" id="top-avatar">A</span>
          <span id="top-username">admin</span>
        </span>
        <button class="btn-logout" id="logout" type="button">退出登录</button>
      </div>
    </header>
    <div id="loading" class="loading" hidden>
      <div class="loading-spin" role="status" aria-label="正在加载"></div>
    </div>
    <main class="content">
      <p class="chart-tip">点下面一根柱子，再往下就是这个投放号的消耗和趋势。</p>
      <section class="split">
        <div class="panel">
          <h2>消耗排名</h2>
          <p class="hint">点一根柱子，下面看这个投放号</p>
          <div class="bar-scroll"><canvas id="cost-bars" class="bars"></canvas></div>
        </div>
        <div class="panel">
          <h2>GMV排名</h2>
          <p class="hint">点一根柱子，下面看这个投放号</p>
          <div class="bar-scroll"><canvas id="gmv-bars" class="bars"></canvas></div>
        </div>
      </section>
      <section class="panel" id="account-box">
        <div class="center-toolbar">
          <select id="operator" aria-label="选择投放号">
            <option value="">全部投放号</option>
          </select>
          <select id="range" class="range-preset" aria-label="选择时间">
            <option value="today">今天</option>
            <option value="yesterday">昨天</option>
            <option value="7" selected>7天</option>
            <option value="30">30天</option>
            <option value="month">本月</option>
            <option value="custom">自定义</option>
          </select>
          <input id="start" type="date" />
          <span class="center-date-sep">至</span>
          <input id="end" type="date" />
          <button class="btn btn-primary" id="query" type="button">查询</button>
        </div>
        <p id="status" class="form-hint">页面读数据库里 10 月 1 日到昨天的数据。今天的详情由定时任务写入 Redis，不在这里现拉。</p>
        <div class="center-metrics" id="kpis"></div>
        <h2 id="trend-title">趋势</h2>
        <div class="chart-box"><canvas id="chart"></canvas></div>
      </section>
      <section class="panel video-panel" id="video-box">
        <h2>被投视频</h2>
        <p class="hint" id="video-summary">选好的时间段里，每个投放号只占一行。</p>
        <div id="video-list"></div>
      </section>
    </main>
  </div>
</div>
  <div id="product-dialog" class="product-dialog" hidden>
    <div class="product-dialog-card" role="dialog" aria-labelledby="product-dialog-title">
      <div class="product-dialog-head">
        <h3 id="product-dialog-title">商品</h3>
        <button type="button" id="product-dialog-close" class="btn">关闭</button>
      </div>
      <ul id="product-dialog-list"></ul>
    </div>
  </div>
  <script>
    const TOKEN_KEY = "zhitou_token";
    const NAME_KEY = "zhitou_display_name";
    if (!localStorage.getItem(TOKEN_KEY)) location.replace("/");
    const displayName = localStorage.getItem(NAME_KEY) || "admin";
    document.getElementById("top-username").textContent = displayName;
    document.getElementById("top-avatar").textContent = displayName.slice(0, 1).toUpperCase();
    async function api(url, options) {
      const headers = Object.assign(
        { Authorization: "Bearer " + localStorage.getItem(TOKEN_KEY) },
        (options && options.headers) || {}
      );
      const res = await fetch(url, Object.assign({}, options, { headers }));
      if (res.status === 401) {
        localStorage.removeItem(TOKEN_KEY);
        location.replace("/");
        throw new Error("请先登录");
      }
      return res;
    }
    const kpiDefs = [
      ["cost", "累计消耗金额"],
      ["order_amount", "成交订单金额"],
      ["order_count", "成交订单数"],
      ["roi", "成交ROI"],
    ];
    const accountKpis = [
      ["cost", "累计消耗金额"],
      ["gmv", "成交订单金额"],
      ["order_count", "成交订单数"],
      ["roi", "成交ROI"],
    ];
    const accountSeries = [
      ["消耗", "#2563eb", (p) => p.cost],
      ["GMV", "#f97316", (p) => p.gmv],
    ];
    const startEl = document.getElementById("start");
    const endEl = document.getElementById("end");
    const statusEl = document.getElementById("status");
    const chart = document.getElementById("chart");

    function iso(d) {
      const z = (n) => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
    }
    function applyRange(preset, startInput, endInput) {
      if (preset === "custom") return;
      const start = new Date();
      const end = new Date();
      if (preset === "yesterday") {
        start.setDate(start.getDate() - 1);
        end.setDate(end.getDate() - 1);
      } else if (preset === "7") {
        start.setDate(start.getDate() - 6);
      } else if (preset === "30") {
        start.setDate(start.getDate() - 29);
      } else if (preset === "month") {
        start.setDate(1);
      }
      startInput.value = iso(start);
      endInput.value = iso(end);
    }
    const rangeEl = document.getElementById("range");
    applyRange(rangeEl.value, startEl, endEl);

    function money(n) {
      const v = Number(n || 0);
      const body = Math.abs(v).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return (v < 0 ? "-¥" : "¥") + body;
    }
    function roiText(n) { return n == null ? "—" : Number(n).toFixed(2); }
    function rateText(n) { return n == null ? "—" : (Number(n) * 100).toFixed(2) + "%"; }
    function cell(key, row) {
      if (key === "roi") return roiText(row.roi);
      if (key === "order_count" || key === "account_count" || key === "rank") return row[key];
      const text = money(row[key]);
      return Number(row[key]) < 0 ? `<span class="neg">${text}</span>` : text;
    }
    function setStatus(text, bad) {
      statusEl.textContent = text || "";
      statusEl.className = bad ? "form-hint err" : "form-hint";
    }
    let busyCount = 0;
    function busy(on) {
      busyCount += on ? 1 : -1;
      if (busyCount < 0) busyCount = 0;
      const spinning = busyCount > 0;
      document.getElementById("query").disabled = spinning;
      document.getElementById("loading").hidden = !spinning;
    }

    function table(rows, columns) {
      if (!rows.length) return "<p class='sub'>这段时间没有数据</p>";
      const head = columns.map((c) => `<th>${c[1]}</th>`).join("");
      const body = rows.map((row) => `<tr>${columns.map((c) => `<td>${c[0] === "name" ? row.name : cell(c[0], row)}</td>`).join("")}</tr>`).join("");
      return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
    }
    const costBars = document.getElementById("cost-bars");
    const gmvBars = document.getElementById("gmv-bars");
    const operatorEl = document.getElementById("operator");
    let selectedName = "";
    let boardData = null;
    let videoData = null;

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[ch]));
    }

    let shownVideoRows = [];

    function productCell(row, index) {
      const count = row.product_count || 0;
      if (!count) return "0";
      return `<button type="button" class="linkish product-link" data-index="${index}">${count}</button>`;
    }

    function openProducts(row) {
      const dialog = document.getElementById("product-dialog");
      document.getElementById("product-dialog-title").textContent = `${row.name} 的商品`;
      const items = row.products || [];
      document.getElementById("product-dialog-list").innerHTML = items.length
        ? items.map((item) => {
            const days = (item.days || []).map((day) => day.slice(5)).join("、");
            const image = /^https?:\/\//i.test(item.image || "")
              ? `<img class="product-thumb" src="${esc(item.image)}" alt="" referrerpolicy="no-referrer">`
              : "";
            return `<li>${image}<div><div>${esc(item.name || item.id || "未命名商品")}</div><div class="video-sub">${days ? "出现在 " + esc(days) : ""}</div></div></li>`;
          }).join("")
        : "<li>库里没有这个投放号的商品名称</li>";
      dialog.hidden = false;
    }

    function closeProducts() {
      document.getElementById("product-dialog").hidden = true;
    }

    function renderVideos(data) {
      const summary = document.getElementById("video-summary");
      const list = document.getElementById("video-list");
      const name = operatorEl.value;
      const rows = ((data && data.operators) || []).filter((row) => !name || row.name === name);
      if (!rows.length || !data) {
        shownVideoRows = [];
        list.innerHTML = "";
        summary.textContent = "选择时间段后，每个投放号汇总成一行。";
        return;
      }
      summary.textContent = `${data.start} 至 ${data.end}，${rows.length} 个投放号。消耗、GMV、平均ROI是这一整段的，作者和商品已去重，同一个视频不按天重复计。`;
      shownVideoRows = rows;
      const body = rows.map((row, index) => {
        const authors = (row.authors || []).map((author) => `<span class="chip">${esc(author)}</span>`).join("");
        return `<tr>
          <td>${esc(row.name)}</td>
          <td>${money(row.cost)}</td>
          <td>${row.order_count}</td>
          <td>${money(row.gmv)}</td>
          <td>${roiText(row.roi)}</td>
          <td class="author-cell"><div>${row.author_count || 0} 人</div><div class="chips">${authors || "—"}</div></td>
          <td>${row.video_count || 0}</td>
          <td>${productCell(row, index)}</td>
        </tr>`;
      }).join("");
      list.innerHTML = `<div class="table-scroll"><table class="plan-table"><thead><tr>
        <th>投放号</th><th>消耗</th><th>订单数</th><th>GMV</th><th>平均ROI</th><th>全部作者</th><th>视频数</th><th>商品数</th>
      </tr></thead><tbody>${body}</tbody></table></div>`;
    }

    function fillOperators(rows) {
      const current = operatorEl.value || selectedName;
      const names = rows.map((row) => row.name).sort((a, b) => a.localeCompare(b, "zh"));
      operatorEl.replaceChildren();
      const all = document.createElement("option");
      all.value = "";
      all.textContent = "全部投放号";
      operatorEl.appendChild(all);
      names.forEach((name) => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        operatorEl.appendChild(option);
      });
      operatorEl.value = names.includes(current) ? current : "";
      selectedName = operatorEl.value;
    }

    function paintKpis(defs, view) {
      document.getElementById("kpis").innerHTML = defs.map(([key, label]) => {
        const raw = view ? view[key] : 0;
        const text = key === "roi" ? roiText(raw) : key === "order_count" ? raw : money(raw);
        return `<article class="center-metric"><div class="label">${label}</div><div class="value">${text}</div></article>`;
      }).join("");
    }

    function showAll() {
      document.getElementById("trend-title").textContent = "趋势";
      window.__trendSeries = null;
      if (!boardData) return;
      paintKpis(kpiDefs, boardData.overview);
      window.__trend = boardData.trend;
      draw(boardData.trend);
    }

    function render(data, fresh) {
      const rankCost = data.rank_cost || [];
      const rankGmv = data.rank_gmv || [];
      costBars._rows = rankCost;
      gmvBars._rows = rankGmv;
      drawBars(costBars, rankCost, "cost", "#7c3aed");
      drawBars(gmvBars, rankGmv, "gmv", "#5b21b6");
      fillOperators(data.operators || rankCost);
      boardData = data;
      videoData = data;
      renderVideos(data);
      if (!selectedName) showAll();
      const total = (data.operators || []).length;
      const products = Number((data.overview && data.overview.product_count) || 0);
      const videos = Number((data.overview && data.overview.video_count) || 0);
      if (!total && !Number(data.overview && data.overview.cost)) {
        setStatus(`${data.start} 至 ${data.end}，库里还没有这段数据`, true);
      } else {
        setStatus(`${data.start} 至 ${data.end}，来自数据库。投放号 ${total} 个，被投视频 ${videos} 个，一共放了 ${products} 个商品`);
      }
    }

    function draw(trend, board, custom) {
      board = board || chart;
      const dpr = window.devicePixelRatio || 1;
      const width = board.clientWidth || 800;
      const height = 280;
      board.width = width * dpr;
      board.height = height * dpr;
      const ctx = board.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);
      const pad = { l: 64, r: 46, t: 28, b: 36 };
      const innerW = width - pad.l - pad.r;
      const innerH = height - pad.t - pad.b;
      const series = custom || [
        ["累计消耗", "#2563eb", (p) => p.cost],
        ["成交订单金额", "#f97316", (p) => p.order_amount],
      ];
      let max = 1, min = 0;
      trend.forEach((p) => series.forEach((s) => {
        max = Math.max(max, s[2](p));
        min = Math.min(min, s[2](p));
      }));
      const span = max - min || 1;
      ctx.strokeStyle = "#e7e4f0";
      ctx.fillStyle = "#6b6580";
      ctx.font = "12px Segoe UI, Microsoft YaHei, sans-serif";
      for (let i = 0; i <= 4; i++) {
        const y = pad.t + innerH * i / 4;
        ctx.beginPath();
        ctx.moveTo(pad.l, y);
        ctx.lineTo(width - pad.r, y);
        ctx.stroke();
        const value = max - span * i / 4;
        ctx.fillText(Math.round(value).toLocaleString("zh-CN"), 8, y + 4);
      }
      const step = trend.length > 1 ? innerW / (trend.length - 1) : innerW;
      series.forEach((s) => {
        ctx.beginPath();
        ctx.strokeStyle = s[1];
        ctx.lineWidth = 2;
        trend.forEach((p, i) => {
          const x = pad.l + step * i;
          const y = pad.t + (max - s[2](p)) / span * innerH;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
      });
      ctx.fillStyle = "#6b6580";
      trend.forEach((p, i) => {
        if (trend.length > 14 && i % 2) return;
        const x = pad.l + step * i;
        ctx.fillText(p.date.slice(5), x - 14, height - 12);
      });
      let legendX = pad.l;
      series.forEach((s) => {
        ctx.fillStyle = s[1];
        ctx.fillRect(legendX, 8, 12, 8);
        ctx.fillStyle = "#1e1b2e";
        ctx.fillText(s[0], legendX + 16, 16);
        legendX += ctx.measureText(s[0]).width + 28;
      });
      if (trend.some((p) => p.account_count != null)) {
        const barMax = Math.max(1, ...trend.map((p) => Number(p.account_count) || 0));
        ctx.fillStyle = "rgba(37,99,235,0.16)";
        trend.forEach((p, i) => {
          const x = pad.l + step * i;
          const h = (Number(p.account_count) || 0) / barMax * 36;
          ctx.fillRect(x - 4, pad.t + innerH - h, 8, h);
        });
      }
    }

    function shortName(name) {
      const head = name.split("(")[0];
      const text = head || name;
      return text.length > 12 ? text.slice(0, 12) + "…" : text;
    }

    function drawBars(canvas, rows, key, color) {
      const dpr = window.devicePixelRatio || 1;
      const height = 380;
      const pad = { l: 58, r: 12, t: 16, b: 108 };
      const slot = 52;
      const parentW = (canvas.parentElement && canvas.parentElement.clientWidth) || 520;
      const width = Math.max(parentW, pad.l + pad.r + Math.max(rows.length, 1) * slot);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);
      const hits = [];
      canvas._hits = hits;
      if (!rows.length) {
        ctx.fillStyle = "#6b6580";
        ctx.font = "13px Segoe UI, Microsoft YaHei, sans-serif";
        ctx.fillText("这段时间没有数据", 16, 40);
        return;
      }
      const values = rows.map((row) => Number(row[key] || 0));
      let max = Math.max(0, ...values);
      let min = Math.min(0, ...values);
      if (max === min) max = min + 1;
      const innerW = width - pad.l - pad.r;
      const innerH = height - pad.t - pad.b;
      const span = max - min;
      const zeroY = pad.t + (max / span) * innerH;
      const gap = innerW / rows.length;
      const barW = Math.max(8, Math.min(36, gap * 0.62));
      ctx.strokeStyle = "#e7e4f0";
      ctx.font = "12px Segoe UI, Microsoft YaHei, sans-serif";
      ctx.beginPath();
      ctx.moveTo(pad.l, zeroY);
      ctx.lineTo(width - pad.r, zeroY);
      ctx.stroke();
      ctx.fillStyle = "#6b6580";
      ctx.fillText(Math.round(max).toLocaleString("zh-CN"), 4, pad.t + 10);
      rows.forEach((row, index) => {
        const value = values[index];
        const x = pad.l + gap * index + (gap - barW) / 2;
        const y = pad.t + ((max - value) / span) * innerH;
        const h = zeroY - y;
        ctx.fillStyle = row.name === selectedName ? "#5b21b6" : color;
        ctx.fillRect(x, h < 0 ? zeroY : y, barW, Math.abs(h) || 1);
        ctx.save();
        ctx.translate(x + barW / 2, height - pad.b + 12);
        ctx.rotate(-Math.PI / 4);
        ctx.fillStyle = "#1e1b2e";
        ctx.textAlign = "right";
        ctx.fillText(shortName(row.name), 0, 0);
        ctx.restore();
        hits.push({ x, w: barW, name: row.name });
      });
    }

    async function chooseAccount(name) {
      const picked = name || "";
      selectedName = picked;
      if (operatorEl.value !== selectedName) operatorEl.value = selectedName;
      if (videoData) renderVideos(videoData);
      drawBars(costBars, costBars._rows || [], "cost", "#7c3aed");
      drawBars(gmvBars, gmvBars._rows || [], "gmv", "#5b21b6");
      if (!picked) {
        showAll();
        return;
      }
      busy(true);
      setStatus(`正在读取 ${picked}…`);
      try {
        const params = new URLSearchParams({ name: picked, start: startEl.value, end: endEl.value });
        const res = await api("/api/v1/launch/operator?" + params.toString());
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "读取失败");
        if (selectedName !== picked) return;
        document.getElementById("trend-title").textContent = picked;
        paintKpis(accountKpis, data.overview);
        window.__trend = data.trend;
        window.__trendSeries = accountSeries;
        draw(data.trend, chart, accountSeries);
        const view = data.overview || {};
        setStatus(`${picked}，${data.start} 至 ${data.end}。消耗 ${money(view.cost)}，成交 ${money(view.gmv)}，ROI ${roiText(view.roi)}`);
      } catch (err) {
        if (selectedName === picked) setStatus(err.message || "读取失败", true);
      } finally {
        busy(false);
      }
    }

    function pickBar(event, canvas) {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const hit = (canvas._hits || []).find((item) => x >= item.x && x <= item.x + item.w);
      if (hit) {
        chooseAccount(hit.name);
        document.getElementById("account-box").scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    async function load() {
      busy(true);
      setStatus("正在读取数据库…");
      try {
        const res = await api(`/api/v1/launch/dashboard?start=${startEl.value}&end=${endEl.value}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "读取失败");
        render(data, false);
      } catch (err) {
        setStatus(err.message || "读取失败", true);
      } finally {
        busy(false);
      }
    }
    document.getElementById("query").onclick = () => load();
    rangeEl.onchange = async () => {
      applyRange(rangeEl.value, startEl, endEl);
      if (rangeEl.value === "custom") return;
      await load();
    };
    startEl.onchange = () => { rangeEl.value = "custom"; };
    endEl.onchange = () => { rangeEl.value = "custom"; };
    document.getElementById("logout").onclick = () => {
      localStorage.removeItem(TOKEN_KEY);
      location.replace("/");
    };
    document.getElementById("video-list").addEventListener("click", (event) => {
      const button = event.target.closest(".product-link");
      if (!button) return;
      const row = shownVideoRows[Number(button.dataset.index)];
      if (row) openProducts(row);
    });
    document.getElementById("product-dialog-close").onclick = closeProducts;
    document.getElementById("product-dialog").onclick = (event) => {
      if (event.target.id === "product-dialog") closeProducts();
    };
    operatorEl.onchange = () => chooseAccount(operatorEl.value);
    costBars.onclick = (event) => pickBar(event, costBars);
    gmvBars.onclick = (event) => pickBar(event, gmvBars);
    window.addEventListener("resize", () => {
      if (window.__trend) draw(window.__trend, chart, window.__trendSeries);
      if (costBars._rows) drawBars(costBars, costBars._rows, "cost", "#7c3aed");
      if (gmvBars._rows) drawBars(gmvBars, gmvBars._rows, "gmv", "#5b21b6");
    });
    const _render = render;
    render = function (data, fresh) {
      _render(data, fresh);
      if (selectedName) chooseAccount(selectedName);
    };
    load();
  </script>
</body>
</html>
